name: Build and check

# The live site is served by Vercel at https://www.brihadhee.com.
# This workflow used to publish a second copy to GitHub Pages
# (shashan3k.github.io/brihadhee), which competed with the custom domain.
# It now only builds and runs the fact, SEO and link checks.
# GitHub Pages was turned off on 2026-11-11.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # End-to-end SEO / AEO / GEO gate: raw HTML, entity and menu accuracy, schema,
      # links, and a preview-server status check (Lighthouse runs locally only).
      - run: npm run verify
